name: JMlab 本地工具链检查

on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_container_validation:
        description: 全部重构完成后手动执行 Docker 发布验证
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/app/package-lock.json
            e2e/package-lock.json
      - name: Go 测试与静态检查
        run: |
          go test -race ./...
          go vet ./...
      - name: 文档链接与 OpenAPI 结构
        run: go -C scripts/check-docs run .
      - name: 公开内容与模块边界
        run: python3 scripts/check-public.py
      - name: 单文件部署配置与密钥持久化（本地 Shell）
        run: python3 scripts/check-release-compose.py
      - name: 前端类型与构建
        run: |
          npm --prefix web/app ci
          npm --prefix web/app run build
          npm --prefix web/app audit
      - name: 安装浏览器检查工具
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: 临时本机服务与浏览器回归
        run: node scripts/check-web.mjs
      - name: 保存失败证据
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: e2e/test-results/
          if-no-files-found: ignore
  container:
    if: github.event_name == 'workflow_dispatch' && inputs.run_container_validation
    runs-on: ubuntu-latest
    env:
      JMLAB_MASTER_KEY: ci-only-master-key-with-at-least-32-bytes
      JMLAB_SESSION_SECRET: ci-only-session-secret-with-at-least-32-bytes
      JMLAB_POSTGRES_PASSWORD: ci-only-postgres-password
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 校验 SQLite Compose 配置
        run: docker compose -f deploy/docker-compose.sqlite.yml config
      - name: 校验 PostgreSQL Compose 配置
        run: docker compose -f deploy/docker-compose.postgres.yml config
      - name: 构建 JMlab 镜像
        run: docker build --tag jmlab:ci .
