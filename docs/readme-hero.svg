      <path d="M716 105H738M716 116H738M716 127H730" stroke="#A5F3FC" stroke-width="2"/>

      <rect x="684" y="240" width="86" height="86" rx="20" fill="#101F32" stroke="#31546B" stroke-width="1.5"/>
      <rect x="704" y="265" width="46" height="36" rx="6" stroke="#A5F3FC" stroke-width="2"/>
      <path d="M724 274L736 283L724 292Z" fill="#A5F3FC"/>

      <rect x="842" y="138" width="124" height="124" rx="30" fill="#123048" stroke="#67E8F9" stroke-opacity="0.12" stroke-width="16"/>
      <rect x="842" y="138" width="124" height="124" rx="30" fill="#123048" stroke="url(#accent)" stroke-width="2"/>
      <path d="M877 182L904 168L931 182L904 196L877 182ZM877 200L904 214L931 200M877 218L904 232L931 218" stroke="url(#accent)" stroke-width="3"/>

      <rect x="1032" y="74" width="86" height="86" rx="20" fill="#101F32" stroke="#3B4F77" stroke-width="1.5"/>
      <rect x="1052" y="96" width="46" height="34" rx="5" stroke="#C7D2FE" stroke-width="2"/>
      <path d="M1064 139H1086M1075 130V139" stroke="#C7D2FE" stroke-width="2"/>

      <rect x="1032" y="240" width="86" height="86" rx="20" fill="#101F32" stroke="#3B4F77" stroke-width="1.5"/>
      <rect x="1060" y="259" width="30" height="48" rx="6" stroke="#C7D2FE" stroke-width="2"/>
      <path d="M1071 299H1079" stroke="#C7D2FE" stroke-width="2"/>
    </g>

    <path d="M88 352H1112" stroke="url(#rule)"/>
    <rect x="88" y="349" width="48" height="6" rx="3" fill="#67E8F9"/>
    <path d="M1144 32H1168V56M32 344V368H56" stroke="#4B7189" stroke-width="2"/>
    <rect x="0.5" y="0.5" width="1199" height="399" rx="23.5" stroke="#506886" stroke-opacity="0.4"/>
  </g>
