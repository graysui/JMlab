<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none" role="img" aria-labelledby="title description">
  <title id="title">JMlab · 模块化媒体空间</title>
  <desc id="description">深蓝网格上的 JMlab 字标与青色模块连接图形，象征内容、媒体库和播放能力的自由组合。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091321"/>
      <stop offset="0.55" stop-color="#101D32"/>
      <stop offset="1" stop-color="#071624"/>
    </linearGradient>
    <linearGradient id="accent" x1="760" y1="92" x2="1000" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="88" y1="133" x2="490" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="rule" x1="88" y1="336" x2="1112" y2="336" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(904 200) scale(290 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0891B2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#9AB9DB" stroke-opacity="0.065"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#background)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#halo)"/>
    <circle cx="904" cy="200" r="168" stroke="#67E8F9" stroke-opacity="0.08"/>
    <circle cx="904" cy="200" r="218" stroke="#818CF8" stroke-opacity="0.08" stroke-dasharray="4 10"/>

    <g font-family="Segoe UI, Arial, sans-serif">
      <path d="M88 78H112" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
      <text x="128" y="86" fill="#B6D4E5" font-size="22" font-weight="600" letter-spacing="4">MODULAR MEDIA</text>
      <text x="82" y="232" fill="url(#wordmark)" font-size="124" font-weight="700" letter-spacing="-5">JMlab</text>
      <text x="88" y="292" fill="#D6E5F2" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="32" font-weight="500" letter-spacing="2">让媒体有序，让连接自由。</text>
    </g>

    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M770 117H812Q828 117 828 133V174H852M770 283H812Q828 283 828 267V226H852M956 200H1000V117H1032M1000 200V283H1032" stroke="url(#accent)" stroke-opacity="0.7" stroke-width="2"/>
      <circle cx="828" cy="150" r="4" fill="#67E8F9"/>
      <circle cx="1000" cy="246" r="4" fill="#A5B4FC"/>

