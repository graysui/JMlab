    post:
      tags: [Playback]
      operationId: createAdminItemPlaybackSource
      summary: 为作品绑定媒体流
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackSourceCreate'
      responses:
        '201':
          description: 媒体流已绑定
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSource'
