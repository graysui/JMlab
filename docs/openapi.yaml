  /api/v1/items/{itemId}/sources:
    get:
      tags: [Playback]
      operationId: listItemPlaybackSources
      summary: 读取作品可用媒体流
      description: 仅返回当前用户可见且具有播放权限的作品来源元数据，不返回上游地址、请求头或令牌。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 媒体流列表
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PlaybackSource' } }
        '401':
          description: 未登录
        '403':
          description: 作品不可见或没有播放权限
  /api/v1/items/{itemId}/sources/{sourceId}/resolve:
    post:
      tags: [Playback]
      operationId: resolveItemPlaybackSource
      summary: 选择并解析作品媒体流
      description: 按指定源、画质、语言和预览标记选择来源；源过期或解析失败时刷新并尝试备用源，成功响应只返回 JMlab 播放地址和短期令牌。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: path, required: true, schema: { type: string } }
        - { name: quality, in: query, required: false, schema: { type: string } }
        - { name: language, in: query, required: false, schema: { type: string } }
        - { name: allowPreview, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: refresh, in: query, required: false, schema: { type: boolean, default: false } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackSelectionRequest'
      responses:
        '200':
          description: 已签发短期播放地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackResolution'
        '401':
          description: 未登录或播放令牌无效
        '403':
          description: 作品不可见或没有播放权限
        '404':
          description: 媒体流不存在
        '502':
          description: 所有候选媒体流均不可用
  /Items/{itemId}/PlaybackInfo:
    get:
      tags: [Jellyfin]
      operationId: jellyfinPlaybackInfo
      summary: 返回 Jellyfin MediaSources
      description: 选择并解析当前用户可播放的来源，MediaSources.Path 使用绑定用户、作品、来源及模块注册版本的短期地址。使用实际媒体描述，不提供服务端转码；仅转码请求返回 NoCompatibleStream。StartTimeTicks 校验非负，由客户端按时间 seek，宿主不将时间换算字节或裁切流。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { name: MediaSourceId, in: query, required: false, schema: { type: string } }
        - { name: Quality, in: query, required: false, schema: { type: string } }
        - { name: Language, in: query, required: false, schema: { type: string } }
        - { name: AllowPreview, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: Refresh, in: query, required: false, schema: { type: boolean, default: false } }
        - { name: PlaySessionId, in: query, required: false, schema: { type: string } }
        - { name: StartTimeTicks, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: AudioStreamIndex, in: query, schema: { type: integer, minimum: 0 } }
        - { name: SubtitleStreamIndex, in: query, schema: { type: integer, minimum: -1 }, description: -1 关闭字幕 }
        - { name: EnableDirectPlay, in: query, schema: { type: boolean, default: true } }
        - { name: EnableDirectStream, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: Jellyfin 播放信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackInfo'
        '400': { description: 播放时间、音轨、字幕或 JSON 参数无效 }
        '401':
          description: 未登录
        '403':
          description: 作品不可见或没有播放权限
        '502':
          description: 所有候选媒体流均不可用
    post:
      tags: [Jellyfin]
      operationId: jellyfinPlaybackInfoPost
      summary: 通过 JSON 选择 Jellyfin 媒体流和轨道
      description: 与 GET 使用相同选源、权限和模块版本规则，查询参数优先于 JSON。未提供 PlaySessionId 时生成新会话标识。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JellyfinPlaybackRequest' }
      responses:
        '200':
          description: 播放信息或 NoCompatibleStream
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackInfo' }
        '400': { description: 播放时间、音轨、字幕或 JSON 参数无效 }
        '401': { description: 未登录 }
        '403': { description: 无查看或播放权限 }
        '502': { description: 无可用来源 }
  /Videos/{itemId}/stream:
    get:
      tags: [Playback]
      operationId: streamVideo
      summary: 播放 HTTP、HLS 分片或 302 来源
      description: 需要当前用户具有作品查看和播放权限；无 token 时自动选择并刷新来源，token 和 HLS resource 均绑定用户、作品、来源、模块注册版本和过期时间。签名允许播放器匿名取流，但已登录的其他用户不能借用。停用、重新启用或替换实例后旧签名失效，应重新获取 PlaybackInfo。
      security: [{ bearerAuth: [] }, { playbackLink: [] }, { resourceLink: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: query, required: false, schema: { type: string } }
        - { name: token, in: query, required: false, schema: { type: string } }
        - { name: resource, in: query, required: false, schema: { type: string } }
        - { name: Range, in: header, required: false, schema: { type: string, example: 'bytes=0-1048575' } }
      responses:
        '200':
          description: 媒体内容或 HLS 播放列表
          headers:
            Accept-Ranges: { schema: { type: string } }
            Content-Length: { schema: { type: integer, format: int64 } }
            Content-Range: { schema: { type: string } }
        '206':
          description: HTTP Range 媒体内容
        '302':
          description: 短期重定向到已校验的媒体流
          headers:
            Location: { schema: { type: string, format: uri } }
        '401':
          description: 未登录
        '403':
          description: 没有作品查看或播放权限
        '416':
          description: Range 格式或范围无效
        '502':
          description: 上游媒体流不可用
    head:
      tags: [Playback]
      operationId: headVideoStream
      summary: 读取媒体响应头
      security: [{ bearerAuth: [] }, { playbackLink: [] }, { resourceLink: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { name: sourceId, in: query, required: false, schema: { type: string } }
        - { name: token, in: query, required: false, schema: { type: string } }
        - { name: Range, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: 媒体响应头
        '206':
          description: Range 响应头
        '401':
          description: 未登录
        '403':
          description: 没有播放权限
  /Videos/{itemId}/master.m3u8:
    get:
      tags: [Playback]
      operationId: getMasterPlaylist
