  /Items:
    get:
      tags: [Jellyfin]
      operationId: jellyfinItems
      description: 默认只返回根目录或 ParentId 的直接子项；Recursive=true 时遍历本项目的剧集、季、单集层级。查询在数据库分页，StartIndex 返回请求偏移。列表和详情均带可见父级身份及子项计数。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ParentId, in: query, schema: { type: string } }
        - { name: Recursive, in: query, schema: { type: boolean, default: false } }
        - { name: SearchTerm, in: query, schema: { type: string } }
        - { name: IncludeItemTypes, in: query, schema: { type: string } }
        - { name: Genres, in: query, schema: { type: string } }
        - { name: Tags, in: query, schema: { type: string } }
        - { name: Years, in: query, schema: { type: string } }
        - { name: Filters, in: query, schema: { type: string } }
        - { name: SortBy, in: query, description: 逗号分隔，支持 Name、SortName、PremiereDate、DateCreated、CommunityRating、ProductionYear、ParentIndexNumber、IndexNumber, schema: { type: string } }
        - { name: SortOrder, in: query, schema: { type: string, enum: [Ascending, Descending] } }
        - { name: StartIndex, in: query, schema: { type: integer, minimum: 0 } }
        - { name: Limit, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Jellyfin 媒体项列表
          content:
