openapi: 3.1.0
info:
  title: JMlab API
  version: 0.1.0
  description: >-
    JMlab 现有 API 参考，重构期间随实现更新；不代表全部端点已完成本轮回归。
    /api/v1 提供 Web 与管理接口，根路径提供 Swiftfin/Jellyfin 兼容接口。
    管理员模块接口与宿主反向服务已接入；模块凭据不能由用户会话代替。
    Web 会话 Cookie 的 Secure 属性由 JMLAB_PUBLIC_URL 的协议决定；Cookie 写操作仍需要 CSRF 凭据。
servers:
  - url: http://localhost:8097
tags:
  - name: Catalog
  - name: Relations
  - name: UserData
  - name: Modules
  - name: Health
  - name: Jellyfin
  - name: Providers
  - name: Playback
  - name: Images
  - name: Libraries
  - name: Collections
  - name: Dashboard
  - name: Statistics
  - name: Rankings
  - name: Tasks
  - name: Audit
  - name: Backup
paths:
  /api/v1/rankings/modules:
    get:
      tags: [Rankings]
      summary: 列出可用模块声明的榜单与范围
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'items 包含 id、name、rankings' }
  /api/v1/rankings/modules/{moduleID}/{rankingType}:
    get:
      tags: [Rankings]
      summary: 读取指定模块榜单的当前快照并过滤用户权限
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moduleID, in: path, required: true, schema: { type: string } }
        - { name: rankingType, in: path, required: true, schema: { type: string } }
        - { name: period, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 'items 为 rank 与 item 的数组' }
        '400': { description: 未声明的榜单或范围 }
        '404': { description: 模块不可用 }
  /api/v1/admin/modules/{moduleID}/rankings:
    parameters:
      - { name: moduleID, in: path, required: true, schema: { type: string } }
    get:
      tags: [Modules]
      summary: 读取榜单声明与自动更新计划（Admin）
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: 'items、revision、schedule；未设置时默认关闭' }
    post:
      tags: [Modules]
      summary: 通过通用任务导入模块榜单（Admin 与 CSRF）
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rankingType, period, revision]
              properties:
                rankingType: { type: string }
                period: { type: string }
                revision: { type: string }
      responses:
        '202': { description: 'taskId、status、reused；同一模块榜单范围互斥' }
        '409': { description: 模块停用或版本已变化 }
  /api/v1/admin/modules/{moduleID}/rankings/schedule:
    put:
      tags: [Modules]
      summary: 保存模块自动更新计划（Admin 与 CSRF）
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moduleID, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled, intervalHours, targets]
              properties:
                enabled: { type: boolean }
                intervalHours: { type: integer, minimum: 1, maximum: 720 }
                updateTime: { type: string, description: '空字符串按间隔运行；HH:MM 按服务器本地时间每天运行' }
                targets:
                  type: array
                  maxItems: 128
                  items:
                    type: object
                    required: [rankingType, period]
                    properties:
                      rankingType: { type: string }
                      period: { type: string }
      responses:
        '200': { description: 已保存的计划及上次运行时间 }
        '400': { description: 参数或模块声明的范围无效 }
  /api/v1/admin/modules/{moduleId}/actions/{actionId}:
    post:
      tags: [Modules]
      operationId: invokeModuleAction
      summary: 调用模块清单声明的管理操作
      description: 仅管理员，Cookie 会话需要 CSRF。内置与第三方使用相同契约，输入只允许清单声明字段。revision 必填，热更新失效返回 409；模块返回的 configPatch 仅由宿主加密保存，不返回浏览器。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: moduleId, in: path, required: true, schema: { type: string } }
        - { name: actionId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revision, input]
              properties:
                revision: { type: string }
                input: { type: object, additionalProperties: true }
      responses:
        '200':
          description: 模块操作结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModuleActionResult' }
        '400': { description: 字段无效、操作未声明或模块执行失败 }
        '401': { description: 需要登录 }
        '403': { description: 需要管理员和有效 CSRF }
        '409': { description: 模块版本已变化，重新读取后操作 }
  /api/v1/items:
    get:
      tags: [Catalog]
      operationId: listCatalogItems
      summary: 分页浏览当前账号可见作品
      description: 默认保留完整目录查询；Web 媒体库使用 topLevel=true，只显示顶层内容。parentId 浏览子目录时默认按季或单集序号升序。游标绑定筛选及排序，条件改变后从第一页重新读取。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: topLevel, in: query, schema: { type: boolean, default: false } }
        - { name: parentId, in: query, description: 与 topLevel=true 互斥, schema: { type: string } }
        - { name: itemType, in: query, schema: { type: string, enum: [movie, series, season, episode, video] } }
        - { name: q, in: query, schema: { type: string } }
        - name: hasPlayableSource
          in: query
          description: 按当前启用模块支持的媒体类型及候选/传统站点状态筛选；false 为其补集。只表示存在可尝试的候选，不保证网络或解码成功。
          schema: { type: boolean }
        - { name: sort, in: query, schema: { type: string, enum: [title, code, year, rating, releaseDate, updatedAt, indexNumber] } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: limit, in: query, schema: { type: integer, default: 24, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: 当前页和不透明 nextCursor；空游标表示没有下一页
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CatalogItem' } }
                  nextCursor: { type: string }
        '400': { description: 媒体类别、顶层条件或游标无效 }
  /api/v1/me/items/{itemId}/state:
    parameters:
      - { name: itemId, in: path, required: true, schema: { type: string } }
    get:
      tags: [UserData]
      operationId: getMyItemState
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前账号的观看记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemState' }
        '404': { description: 作品不存在或不可见 }
    put:
      tags: [UserData]
      operationId: saveMyItemState
      description: 部分更新；rating 省略保留原评分，显式 null 清空，0 是有效评分。note 空字符串清空备注。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                favorite: { type: boolean }
                watched: { type: boolean }
                wantToWatch: { type: boolean }
                rating: { type: [integer, 'null'], minimum: 0, maximum: 10 }
                note: { type: string, maxLength: 2000 }
                positionTicks: { type: integer, format: int64 }
                runtimeTicks: { type: integer, format: int64 }
                version: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 更新后的观看记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemState' }
        '400': { description: 格式或评分无效 }
        '404': { description: 作品不存在或不可见 }
        '409': { description: 版本冲突，需重新读取 }
  /api/v1/me/preferences:
    get:
      operationId: getPreferences
      summary: 当前用户的偏好和内容访问确认状态
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: theme、moduleFlags、locale 和可选 adultConfirmedAt }
        '401': { description: 未登录 }
    patch:
      operationId: updatePreferences
      summary: 更新当前用户偏好
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme: { type: object, additionalProperties: true }
                moduleFlags: { type: object, additionalProperties: true }
                locale: { type: string }
                adultConfirmed: { type: boolean, description: true 明确确认，false 取消确认，省略保留；新用户默认未确认 }
      responses:
        '200': { description: 保存后的偏好 }
        '400': { description: 格式无效 }
        '401': { description: 未登录 }
        '403': { description: Cookie 写操作缺少有效 CSRF 凭据 }
  /api/v1/module-host/{moduleID}/storage:
    parameters:
      - $ref: '#/components/parameters/HostModuleId'
    get:
      tags: [Modules]
      operationId: moduleStorageKeys
      summary: 列出模块专属存储键
      description: 需要 permissions.storage；最多 256 键、1 MiB 密文、4 并发及每分钟 120 请求。
      security: [{ moduleAuth: [] }]
      responses:
        '200':
          description: 键列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys: { type: array, items: { type: string } }
        '401': { description: 模块凭据无效、已更新或已停用 }
        '403': { description: 没有存储授权 }
        '429': { description: 超过并发或频率限制 }
  /api/v1/module-host/{moduleID}/storage/{key}:
    parameters:
      - $ref: '#/components/parameters/HostModuleId'
      - name: key
        in: path
        required: true
        schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$' }
    get:
      tags: [Modules]
      operationId: moduleStorageGet
      summary: 读取当前模块自己的 JSON 值
      security: [{ moduleAuth: [] }]
      responses:
        '200':
          description: 解密后的存储值
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: {}
        '401': { description: 模块身份无效 }
        '403': { description: 没有存储授权 }
        '404': { description: 键不存在 }
        '429': { description: 超过并发或频率限制 }
    put:
      tags: [Modules]
      operationId: moduleStoragePut
      summary: 加密保存模块专属 JSON 值
      security: [{ moduleAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              additionalProperties: false
              properties:
                value: { description: 任意 JSON 值，编码后最多 16 KiB }
      responses:
        '200': { description: 已保存 }
        '400': { description: 键或值格式无效 }
        '401': { description: 模块身份无效 }
        '403': { description: 没有存储授权 }
        '413': { description: 命名空间配额已满 }
        '429': { description: 超过并发或频率限制 }
    delete:
      tags: [Modules]
      operationId: moduleStorageDelete
      summary: 删除模块自己的存储键
      security: [{ moduleAuth: [] }]
      responses:
        '200': { description: 已删除，重复删除幂等 }
        '401': { description: 模块身份无效 }
        '403': { description: 没有存储授权 }
        '429': { description: 超过并发或频率限制 }
  /api/v1/module-host/{moduleID}/invoke:
    parameters:
      - $ref: '#/components/parameters/HostModuleId'
    post:
      tags: [Modules]
      operationId: invokeModule
      summary: 调用清单明确授权的模块方法
      description: 最多四个模块，禁止循环；调用五秒超时，响应最多 8 MiB。调用票据有效 45 秒，绑定调用者、版本和调用链。
      security: [{ moduleAuth: [] }]
      parameters:
        - name: X-JMlab-Call-Ticket
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [moduleId, method]
              additionalProperties: false
              properties:
                moduleId: { type: string }
                method: { type: string, enum: [caps, search, detail, rankings, discover, resolve, probe] }
                payload: { type: object, additionalProperties: true, description: 与对应模块 HTTP 契约相同，最多 32 KiB }
      responses:
        '200': { description: 对应模块方法的 JSON 结果 }
        '400': { description: 请求格式无效 }
        '401': { description: 模块凭据或调用票据无效 }
        '403': { description: 目标或方法未授权 }
        '409': { description: 循环调用或深度超限 }
        '429': { description: 超过并发或频率限制 }
        '502': { description: 目标超时、失败或响应无效 }
        '503': { description: 目标模块未启用 }
  /health/live:
    get:
      tags: [Health]
      operationId: healthLive
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: healthReady
      responses:
        '200':
          description: 数据库和必要依赖已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: 服务尚未就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1:
    get:
      summary: API 版本占位
      description: 功能包接入后，该路径组将由具体资源路由替代。
      responses:
        '404':
          description: 尚未定义具体资源
  /Sessions/Playing:
    post:
      tags: [Jellyfin]
      operationId: jellyfinPlaying
      summary: 记录 Jellyfin 播放开始事件
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JellyfinPlaybackEvent'
      responses:
        '204':
          description: 播放事件已记录
        '400':
          description: 播放事件格式或进度无效
        '404':
          description: 作品不存在或当前用户不可见
        '409':
          description: 播放状态版本冲突
  /Sessions/Playing/Progress:
    post:
      tags: [Jellyfin]
      operationId: jellyfinPlayingProgress
      summary: 记录 Jellyfin 播放进度事件
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JellyfinPlaybackEvent'
      responses:
        '204':
          description: 播放进度已记录
        '400':
          description: 播放事件格式或进度无效
        '404':
          description: 作品不存在或当前用户不可见
        '409':
          description: 播放状态版本冲突
  /Sessions/Playing/Stopped:
    post:
      tags: [Jellyfin]
      operationId: jellyfinPlayingStopped
      summary: 记录 Jellyfin 播放停止事件
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JellyfinPlaybackEvent'
      responses:
        '204':
          description: 播放停止已记录
        '400':
          description: 播放事件格式或进度无效
        '404':
          description: 作品不存在或当前用户不可见
        '409':
          description: 播放状态版本冲突
  /api/v1/items/{itemId}/images:
    get:
      tags: [Images]
      operationId: listItemImages
      summary: 列出作品图片及缓存元数据
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 图片列表；响应只返回 JMlab 代理 URL，不返回图源地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
        '404':
          description: 作品不存在或当前用户不可见
  /api/v1/items/{itemId}/images/reload:
    post:
      tags: [Images]
      operationId: reloadItemImages
      summary: 按来源优先级刷新作品图片
      description: 某个来源失败时保留已有成功图片，并在服务端记录失败尝试。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageReloadRequest'
      responses:
        '200':
          description: 所有图片来源均成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageReloadResponse'
        '207':
          description: 部分来源失败，但至少一个来源成功
        '502':
          description: 所有来源失败
        '400':
          description: 请求无效
  /api/v1/items/{itemId}/images/{imageId}/content:
    get:
      tags: [Images]
      operationId: getItemImageContent
      summary: 读取代理图片或缩略图
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
        - { name: imageId, in: path, required: true, schema: { type: string } }
        - { name: width, in: query, schema: { type: integer, minimum: 1, maximum: 2048 } }
        - { name: height, in: query, schema: { type: integer, minimum: 1, maximum: 2048 } }
        - { name: fit, in: query, schema: { type: string, enum: [cover, contain], default: cover } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: 图片内容，支持缩放、裁剪和条件缓存
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
        '304':
          description: 图片未变化
        '404':
          description: 图片不存在或当前用户不可见
        '400':
          description: 尺寸或裁剪参数无效
  /api/v1/me/images/{imageId}/favorite:
    post:
      tags: [Images]
      operationId: favoriteImage
      summary: 收藏图片
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: 收藏状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageFavoriteResponse'
        '404':
          description: 图片不存在或当前用户不可见
    delete:
      tags: [Images]
      operationId: unfavoriteImage
      summary: 取消收藏图片
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: imageId, in: path, required: true, schema: { type: string } }
        - { name: X-CSRF-Token, in: header, required: false, schema: { type: string } }
      responses:
        '200':
          description: 收藏状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageFavoriteResponse'
        '404':
          description: 图片不存在或当前用户不可见
  /api/v1/me/images/favorites:
    get:
      tags: [Images]
      operationId: listFavoriteImages
      summary: 列出当前用户收藏的图片
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 当前用户图片收藏
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageList'
  /api/v1/playback/sources:
    post:
      tags: [Playback]
      operationId: createPlaybackSource
      summary: 创建媒体流
      description: 管理员或编辑者绑定已通过 Provider 域名校验的播放地址；候选地址、解析地址和请求头只在服务端加密保存。
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackSourceCreate'
      responses:
        '201':
          description: 媒体流已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSource'
        '400':
          description: 媒体流或地址校验失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 未登录
        '403':
          description: 无权配置媒体流
        '404':
          description: 作品或 Provider 不存在
  /api/v1/playback/sources/{sourceId}:
    get:
      tags: [Playback]
      operationId: getPlaybackSource
      summary: 读取媒体流
      description: 返回媒体流元数据，不返回候选地址、解析地址或上游请求头。
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: sourceId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 媒体流元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSource'
        '401':
          description: 未登录
        '403':
