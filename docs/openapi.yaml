  /api/v1/admin/items/{itemId}/sources/probe:
    post:
      tags: [Playback]
      operationId: probeAdminItemPlaybackSources
      summary: 批量探测作品媒体流
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: itemId, in: path, required: true, schema: { type: string } }
