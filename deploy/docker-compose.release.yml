services:
  jmlab:
    image: graysui/jmlab:v1.0.1
    restart: unless-stopped
    ports:
      - "8097:8097"
    environment:
      # 改成实际访问地址；使用域名和 HTTPS 时填写对应地址。
      JMLAB_PUBLIC_URL: "http://localhost:8097"
      # 首次启动前设置自己的密码，至少 6 位英文、数字或符号；$ 写成 $$。
      JMLAB_BOOTSTRAP_ADMIN_PASSWORD: ""
    volumes:
      - jmlab-data:/data
      - jmlab-backup:/backup

volumes:
  jmlab-data:
  jmlab-backup:
